<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Cargo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Web site created using create-react-app" />
  <!-- Tab icon. favicon.svg is not true vector — it is a filtered raster
       wrapped in an <svg> — and Safari will not draw it. Declaring PNGs was
       not enough on its own, so the baseline is now a real multi-size
       favicon.ico at the root: the one format every browser has always
       honoured, and the file Safari looks for by convention even when it
       ignores the <link> tags. PNGs follow for browsers that prefer them,
       and the SVG stays last. No query strings — Safari's favicon cache is
       keyed loosely enough that a fresh path is more reliable than ?v=. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <!-- DM Serif Display gets its own dedicated <link> so the editorial headline
       (.p-greeting via var(--font-serif)) loads reliably. Combining it into
       the multi-family link below was returning unreliably across routes
       (some pages got it, some fell back to Georgia). Explicit axis spec
       `ital,wght@0,400;1,400` requests upright AND italic at weight 400 —
       the only weight DM Serif Display ships. -->
  <link href="/fonts/fonts.css" rel="stylesheet" />
  <!-- Full-weight Inter (400-900) + Newsreader (ital + 400-700) — the
       onboarding "Wrapped" tour needs the black/900 numerals and the
       italic serif welcome headline; the base tailwind.css Inter import
       only carries 400/500. -->
  <!-- Manrope — the row-label face on the profile settings surfaces (.s2-label). -->
  </head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div class="dhiwise-code" id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
