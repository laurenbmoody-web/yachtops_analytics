name: Native app build

# Compiles the Cargo iOS and Android apps (Capacitor) whenever the native
# projects, the native bridge code or dependencies change. Unsigned — this
# proves the projects build; store builds are signed separately.
#
# The Android job uploads a debug APK you can sideload onto a test phone.
# Optional repo secrets so that APK talks to the real backend:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  (same public values as Netlify)

on:
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'src/lib/native/**'
      - 'package.json'
      - '.github/workflows/native-build.yml'
  workflow_dispatch: {}

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
  NODE_OPTIONS: --max_old_space_size=6144

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Build web app
        run: npx vite build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build web app
        run: npx vite build
      - run: npx cap sync ios
      - name: Build for the simulator (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
